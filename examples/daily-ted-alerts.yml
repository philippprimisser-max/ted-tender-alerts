# Copy this file to .github/workflows/ in your own copy of the repository.
# Runs every weekday morning, reports new tenders and keeps the state + Atom feed in the repository.
# Edit the filters in the "Check TED" step. To get e-mails, add the SMTP_* and MAIL_TO secrets
# (Settings > Secrets and variables > Actions) and add --email to the command.
name: daily-ted-alerts
on:
  schedule:
    - cron: "15 5 * * 1-5"   # 05:15 UTC, Monday to Friday
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check TED
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          python ted_alerts.py --cpv 72 48 --country AUT DEU --days 3 \
            --state data/ted_state.json --atom data/feed.xml --markdown data/latest.md
      - name: Save state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "TED alerts $(date -u +%F)"
          git push
